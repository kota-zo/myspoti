# Builds and tests every push / pull request; a "v*" tag publishes signed APKs (arm64-v8a, armeabi-v7a)
# as a GitHub release (the app's update check reads those releases).
name: Android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: myspoti-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the previous tag, for a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Strict semver tags, so Obtainium and the app compare versions right: "v2.2.1-beta.1" (a beta
      # of the next version, above the last stable) or "v2.2.1". See tools/check_tag.py.
      - name: Tag format
        working-directory: .
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME"

      # Two keys, one per channel (they install side by side as two apps):
      # betas ("v2.0.0-beta.3") use MYSPOTI_KEYSTORE_BASE64, MYSPOTI_KEYSTORE_PASSWORD,
      # MYSPOTI_KEY_ALIAS, MYSPOTI_KEY_PASSWORD; releases use the same names with
      # MYSPOTI_STABLE_ in front. Keep each key for good, or installed apps cannot update.
      - name: Signing key
        env:
          BETA: ${{ contains(github.ref_name, '-') }}
          BETA_KEYSTORE: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 }}
          STABLE_KEYSTORE: ${{ secrets.MYSPOTI_STABLE_KEYSTORE_BASE64 }}
        run: |
          if [ "$BETA" = "true" ]; then KEYSTORE_BASE64="$BETA_KEYSTORE"; NAME=MYSPOTI_KEYSTORE_BASE64; else KEYSTORE_BASE64="$STABLE_KEYSTORE"; NAME=MYSPOTI_STABLE_KEYSTORE_BASE64; fi
          test -n "$KEYSTORE_BASE64" || { echo "::error::$NAME secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APK
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEYSTORE_PASSWORD || secrets.MYSPOTI_STABLE_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEY_ALIAS || secrets.MYSPOTI_STABLE_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ contains(github.ref_name, '-') && secrets.MYSPOTI_KEY_PASSWORD || secrets.MYSPOTI_STABLE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # One APK per ABI, same versionCode (a phone installs only its own; the app's update check
          # picks it, UpdateChecker.apkAsset): myspoti-beta-2.2.1-beta.1-arm64-v8a.apk,
          # myspoti-stable-2.2.1-armeabi-v7a.apk... Obtainium filters on the channel and the ABI.
          # Each APK leaves apk/release/, which the next assembleRelease empties.
          CHANNEL=stable; case "$VERSION" in *-*) CHANNEL=beta ;; esac
          mkdir -p app/build/release-apks
          for ABI in arm64-v8a armeabi-v7a; do
            ./gradlew assembleRelease \
              -Pabis="$ABI" \
              -PappVersionName="$VERSION" \
              -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))" \
              -PupdateRepo="$GITHUB_REPOSITORY"
            mv app/build/outputs/apk/release/app-release.apk "app/build/release-apks/myspoti-$CHANNEL-$VERSION-$ABI.apk"
          done

      # This version's section of CHANGELOG.md becomes the release description.
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          # A beta without its own section: the CHANGELOG lines added since the previous tag,
          # else (first beta) the section of the version it leads to.
          PREVIOUS="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ ! -s release-notes.md ] && [ "$VERSION" != "${VERSION%%-*}" ] && [ -n "$PREVIOUS" ]; then
            git diff "$PREVIOUS" "$GITHUB_REF_NAME" -- ../CHANGELOG.md | grep '^+- ' | sed 's/^+//' > release-notes.md || true
          fi
          [ -s release-notes.md ] || awk -v v="${VERSION%%-*}" '$0 == "## " v {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: base/app/build/release-apks/myspoti-*.apk
          body_path: base/release-notes.md
          generate_release_notes: true
          # "v2.0.0-beta.1": a pre-release, offered only to beta builds.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Announces the release on Discord (secret DISCORD_WEBHOOK_URL; nothing posted without it).
      # A release created with GITHUB_TOKEN triggers no other workflow, hence this step here.
      - name: Discord announcement
        continue-on-error: true
        working-directory: .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discord_release.py "$GITHUB_REF_NAME"
