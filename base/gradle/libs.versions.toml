[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.14.0"
webkit = "1.13.0"
composeBom = "2026.06.01"
material3 = "1.5.0-beta02"
activityCompose = "1.10.0"
lifecycleRuntime = "2.9.0"
media = "1.8.0"
okhttp = "5.5.1"
serialization = "1.11.0"
coroutines = "1.11.0"
# Compose Multiplatform, for the desktop app (Linux, Windows).
composeMultiplatform = "1.12.2"
# Media3, as :app already ships it (its raw coordinates there); :engine-android uses this ref.
media3 = "1.8.0"
junit = "5.13.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }

# Jetpack Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }

# Utils
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Chrome's Accept-Encoding on the relayed requests (br, zstd), decoded on the OkHttp path.
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
# Cronet from Google Play services: the Chromium network stack for refused commands before Android 14.
play-services-cronet = { module = "com.google.android.gms:play-services-cronet", version = "18.1.1" }

# Media3 player for the native engine's DrmPlayer (:engine-android)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

# Serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Dispatchers.Main on the desktop (the Swing event thread Compose Desktop draws on).
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Tests
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The native playback core (:engine): commonMain code, a jvm() target for now.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
